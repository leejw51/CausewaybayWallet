# Causewaybay Wallet — the Rust workspace.
#
#   core/  causewaybay-core  the wallet itself: keys, store, RPC, commands.
#                            No terminal, no stdin, no process exit — every
#                            command is a function returning data.
#   ffi/   causewaybay-ffi   a C ABI over core, one JSON string in and one
#                            JSON string out. This is what the Lua CLI and
#                            the LÖVE GUI load.
#   cli/   causewaybay-cli   the `cwbwallet` binary: clap, the TUI, and the
#                            terminal behaviours core deliberately lacks.
#
# The version lives here so all three crates carry one number; the root
# Makefile reads it from this file and refuses to package until the Python
# implementation claims the same one.

[workspace]
resolver = "2"
members = ["core", "ffi", "cli"]

[workspace.package]
version = "1.0.3"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/leejw51/CausewaybayWallet"

[workspace.dependencies]
causewaybay-core = { path = "core", version = "1.0.0" }

alloy-primitives = "1.6"
k256 = { version = "0.13", features = ["ecdsa", "schnorr", "arithmetic"] }
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rand = "0.8"
hex = "0.4"
# Secrets are wiped when they go out of scope rather than left in freed memory,
# where a realloc, a swap file or a core dump can still carry them.
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ratatui = "0.29"
crossterm = "0.28"
unicode-normalization = "0.1"

# --- the async chain layer ---
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
futures-executor = "0.3"
async-trait = "0.1"
anyhow = "1"

# --- Solana ---
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
bs58 = "0.5"
base64 = "0.22"

# --- Cardano ---
ed25519-bip32 = "0.4"
blake2 = "0.10"
bech32 = "0.11"

# --- Midnight ---
# Pinned to the ledger 8.1.x series the preview network runs; the wallet
# refuses to build for a node reporting another generation rather than
# submitting bytes it cannot read.
midnight-ledger = { version = "=8.1.1", features = ["proving"] }
base-crypto = { version = "1.0", package = "midnight-base-crypto" }
coin-structure = { version = "2.0", package = "midnight-coin-structure" }
transient-crypto = { version = "2.0", package = "midnight-transient-crypto" }
storage = { version = "2.0", package = "midnight-storage" }
serialize = { version = "1.0", package = "midnight-serialize" }
onchain-runtime = { version = "3.1", package = "midnight-onchain-runtime" }
zkir = { version = "=2.1.0", package = "midnight-zkir" }
zswap = { version = "=8.1.1", package = "midnight-zswap" }

assert_cmd = "2"
predicates = "3"
tempfile = "3"
tiny_http = "0.12"

[profile.release]
strip = true
