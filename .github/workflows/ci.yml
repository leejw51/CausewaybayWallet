# CI — the checks `make check` runs, split so a failure names itself.
#
# Rust and Python are independent implementations (their own toolchain, their
# own test runner), so they get their own jobs and fail separately. Lua and C
# are front ends over the Rust core rather than further implementations, so
# their jobs build the library the way each one consumes it — Lua the cdylib it
# loads at run time, C the staticlib it links in — and run against that. The
# LÖVE GUI sits on the Lua binding and gets its own job, which runs its logic
# headlessly: no window is opened, because none is needed to test a model that
# makes no `love.` calls. What binds them all, the shared test vectors and the
# parity script, is another job that needs everything built, and packaging is a
# last one that only runs once a change has landed on main.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only, declared rather than inherited. Nothing here publishes anything —
# the release workflow is where write access belongs — and on a public
# repository an undeclared block takes whatever the repository default happens
# to be, which is not a thing to leave to a setting.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cheap, and it is the number a tag will later be compared against.
      - name: Both implementations agree on one version
        run: make version

  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned to the version development happens on, so clippy and rustfmt can
      # never disagree with a local `make check`. The crate's own floor is the
      # `rust-version` in Cargo.toml.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rustcli

      - run: make -C rustcli fmt-check
      - run: make -C rustcli lint
      - run: make -C rustcli test

  lua:
    name: Lua (LuaJIT, over the C ABI)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rustcli

      # LÖVE embeds LuaJIT, so LuaJIT is what the GUI will run this code on.
      # Testing against plain Lua would test a language the wallet never uses —
      # and could not, since only LuaJIT has the `ffi` module.
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends luajit

      # `make -C luacli test` builds the shared library first; it is listed
      # separately so a Rust build failure does not read as a Lua test failure.
      - run: make -C luacli lint
      - run: make -C luacli build
      - run: make -C luacli test

  c:
    name: C (static link)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rustcli

      # `make -C ccli check` builds the release staticlib first; the steps are
      # split so a Rust build failure does not read as a C test failure.
      - run: make -C ccli lint
      - run: make -C ccli build
      - run: make -C ccli test
      # The claim the whole directory rests on, checked rather than assumed.
      - run: make -C ccli verify-static

  gui:
    name: GUI (headless model, anim, particles)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rustcli

      # LuaJIT only. The suite runs without LÖVE, which is the payoff of
      # keeping the model and the motion free of `love.` calls — a headless
      # runner can check the logic even though it cannot open a window.
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends luajit

      - run: make -C lovegui lint
      - run: make -C lovegui test

  python:
    name: Python (ruff, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The floor from pyproject.toml, and the interpreter PyApp embeds in
        # the released binary — the two versions a break would actually reach.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # Python is a binding over the Rust core, so the core has to exist before
      # its tests can run. Toolchain and cache match the Rust job, so this
      # builds against the same compiler the library ships from.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rustcli

      # `make -C pythoncli test` builds the shared library first; it is listed
      # separately so a Rust build failure does not read as a Python failure.
      - run: make -C pythoncli fmt-check
      - run: make -C pythoncli lint
      - run: make -C pythoncli build
      - run: make -C pythoncli test

  parity:
    name: Parity (vectors, cross-implementation)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # PyApp embeds 3.12, so parity is checked on what ships.
          python-version: "3.12"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rustcli

      # Without it the parity script and the coverage check skip their Lua
      # half, and would report a narrower run as a pass.
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends luajit

      # Builds all four, C included — parity skips what is not built, so this
      # is what stops the run quietly covering less than it appears to.
      - run: make build

      # Reproducibility of the committed vectors, then the mutation check that
      # proves every suite really reads them, then the four CLIs driving one
      # store. This is the part no single language's own test job can cover.
      - run: make test-vectors
      - run: make test-vector-coverage
      - run: make test-parity

  # Packaging, split by what a pull request can afford.
  #
  # The full job below needs PyApp to download a CPython distribution and build
  # a launcher around it — minutes of work that a pull request should not pay
  # for on every push, so it runs only after a change has landed. That gap has
  # let two breaks through: a macOS link that lost its libraries, and before it
  # a build nothing exercised until after merge. Both were found on main, which
  # is the wrong place to find them.
  #
  # So pull requests get the same path without the expensive part: the compiled
  # artifacts, the static link, and whether the binaries in ./dist run and still
  # read one store. It is the platform that broke, at about a minute.
  package-smoke:
    name: Package (macOS, no PyApp)
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rustcli

      # The Lua bundle is staged and run, so the interpreter has to be here.
      - name: Install LuaJIT
        run: brew install luajit

      # No signing secrets on a pull request; codesign-binary.sh falls back to
      # ad-hoc, which is what this needs — the question is whether it links and
      # runs, not whether it is notarized.
      - run: make package-smoke

  package:
    name: Package (macOS)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rustcli

      # No signing secrets here: `scripts/codesign-binary.sh` falls back to
      # ad-hoc signing, which is what a dry run wants. Release does the real one.
      - name: Package and verify
        run: make package-verify

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cwbwallet-macos-unsigned
          path: dist/*
          if-no-files-found: error
          retention-days: 7
