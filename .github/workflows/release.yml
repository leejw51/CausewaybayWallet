# Release — build both wallet binaries for macOS and attach them to a GitHub
# release.
#
# Triggered by pushing a tag like `v0.1.0`, which must match the version of
# record — `make version`, which prints the number only once rustcli/Cargo.toml
# and pythoncli/pyproject.toml agree on it. Or manually via workflow_dispatch
# for a dry run that uploads the artifacts without creating a release.
#
#   macos-latest → cwbwallet-rust-<version>-<arch>-apple-darwin.tar.gz
#                  cwbwallet-python-<version>-<arch>-apple-darwin.tar.gz
#                  cwbwallet-lua-<version>-<arch>-apple-darwin.tar.gz
#                  cwbwallet-c-<version>-<arch>-apple-darwin.tar.gz
#
# `make package-verify` drives everything: cargo builds the Rust binary, PyApp
# wraps the Python wheel around an embedded CPython, scripts/codesign-binary.sh
# signs (and notarizes) each one, and scripts/parity.sh then runs against ./dist
# so what ships is what was checked — including that both binaries report the
# version in the manifests, which this workflow has already matched to the tag.
#
# Signing uses the Developer ID certificate from the repository secrets
# (MACOS_CERTIFICATE_P12_BASE64 / MACOS_CERTIFICATE_PASSWORD) and notarization
# uses APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / TEAM_ID. Without the secrets
# everything falls back to ad-hoc signing, so dry runs still produce binaries.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  package:
    name: Package (macOS)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned to the version development happens on — same as CI.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Only used to build the wheel; PyApp embeds its own interpreter
          # (PYAPP_PYTHON_VERSION in pythoncli/Makefile) into the binary.
          python-version: "3.12"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rustcli

      # The Lua front end ships as source plus the shared library, but the
      # parity run inside `make package-verify` has to be able to execute it.
      - name: Install LuaJIT
        run: brew install luajit

      # `make version` fails outright when the two manifests disagree, so this
      # settles both questions at once: one version, and it is the tagged one.
      - name: Resolve the version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(make version)
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${TAG#v}" != "$version" ]; then
            echo "tag $TAG does not match the version of record $version" >&2
            echo "bump rustcli/Cargo.toml and pythoncli/pyproject.toml, or retag" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"

      # Imports the Developer ID certificate into a throwaway keychain and
      # exports APPLE_SIGNING_IDENTITY for the build. Falls back to ad-hoc
      # signing when the secret is absent (e.g. a fork's dry run).
      - name: Import codesigning certificate
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "::warning::MACOS_CERTIFICATE_P12_BASE64 not set, using ad-hoc signing"
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          CERT_INFO=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" || true)
          if [ -n "$CERT_INFO" ]; then
            CERT_ID=$(echo "$CERT_INFO" | head -1 | awk -F'"' '{print $2}')
            echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"
            echo "Found certificate: $CERT_ID"
          else
            echo "::warning::No Developer ID Application certificate found, using ad-hoc signing"
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi

      # scripts/codesign-binary.sh reads APPLE_SIGNING_IDENTITY to sign each
      # binary and APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID to notarize it.
      - name: Package and verify
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          if [ "${APPLE_SIGNING_IDENTITY:--}" = "-" ]; then
            # An ad-hoc-signed binary cannot be notarized.
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          make package-verify

      # One archive per front end. The two compiled ones hold the binary under
      # the name it is meant to be installed as, so either tarball gives you
      # `cwbwallet`; the Lua one holds the whole self-contained bundle, since
      # it is a script that needs its modules and its shared library beside it.
      # COPYFILE_DISABLE keeps macOS from smuggling ._ resource-fork files in.
      - name: Archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ steps.version.outputs.arch }}
        run: |
          mkdir -p artifacts stage
          for impl in rust python c; do
            rm -rf stage/*
            cp "dist/cwbwallet-$impl" stage/cwbwallet
            cp LICENSE README.md stage/
            name="cwbwallet-$impl-$VERSION-$ARCH-apple-darwin.tar.gz"
            COPYFILE_DISABLE=1 tar -czf "artifacts/$name" -C stage .
            echo "  $name"
          done

          rm -rf stage/*
          cp -R dist/cwbwallet-lua/. stage/
          cp LICENSE README.md stage/ && cp luacli/README.md stage/README-lua.md
          name="cwbwallet-lua-$VERSION-$ARCH-apple-darwin.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "artifacts/$name" -C stage .
          echo "  $name"

          ( cd artifacts && shasum -a 256 *.tar.gz > SHA256SUMS )
          cat artifacts/SHA256SUMS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cwbwallet-macos-${{ steps.version.outputs.arch }}
          path: artifacts/*
          if-no-files-found: error

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12"

  # ---------------------------------------------------------------- the app
  #
  # CAUSEWAYBAY BANK as a double-clickable macOS bundle: LÖVE downloaded and
  # embedded, the game and the wallet's shared library inside it, signed,
  # notarised and stapled.
  #
  # Notarising is what makes the difference between a bundle that opens and one
  # that shows "Apple could not verify…". A Developer ID signature with the
  # hardened runtime is necessary and not sufficient — since macOS 10.15
  # anything distributed outside the App Store must be notarised too, and
  # `spctl` asked the way Finder asks will say so.
  #
  # The recipe is `lovegui/Makefile`'s, not this file's. Everything here is
  # credentials and plumbing, so that `make app && make notarize` on a laptop
  # and a tagged release do the same thing.
  package-gui:
    name: Package the LÖVE app (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.1
        with:
          workspaces: rustcli

      # The same check the other job makes: a tag that disagrees with the
      # version of record is a mistake worth stopping for, not shipping.
      - name: Resolve the version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(make version)
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${TAG#v}" != "$version" ]; then
            echo "tag $TAG does not match the version of record $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"

      - name: Import codesigning certificate
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then
            echo "::warning::MACOS_CERTIFICATE_P12_BASE64 not set, using ad-hoc signing"
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          CERT_INFO=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" || true)
          if [ -n "$CERT_INFO" ]; then
            CERT_ID=$(echo "$CERT_INFO" | head -1 | awk -F'"' '{print $2}')
            echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"
            echo "Found certificate: $CERT_ID"
          else
            echo "::warning::No Developer ID Application certificate found, using ad-hoc signing"
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi

      # `make app` reads APPLE_SIGNING_IDENTITY, downloads LÖVE, embeds the
      # game, signs inside-out and checks the archive carries every module.
      #
      # The smoke test it normally runs is skipped: it starts the bundle and
      # waits for a frame, and a runner has no window server to draw into.
      # `verify-archive` still runs and catches the same fault — a module left
      # out of the staging — deterministically.
      - name: Build and sign the app
        run: make -C lovegui app SKIP_SMOKE=1

      # Only with a real certificate: Apple refuses an ad-hoc signature, and a
      # fork's dry run has no secrets. The Makefile checks this too and would
      # stop before uploading; this keeps the log honest about why.
      - name: Notarize and staple
        if: env.APPLE_SIGNING_IDENTITY != '-'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.TEAM_ID }}
        run: make -C lovegui notarize

      # What a person downloading it will actually get. Printed either way,
      # because "signed but not notarised" is the state worth seeing in a log.
      - name: Assess with Gatekeeper
        run: make -C lovegui gatekeeper

      - name: Name the archive
        run: |
          mkdir -p dist-gui
          cp "lovegui/build/CausewaybayBank-macos.zip" \
            "dist-gui/CausewaybayBank-${{ steps.version.outputs.version }}-${{ steps.version.outputs.arch }}-apple-darwin.zip"
          cd dist-gui && shasum -a 256 *.zip > SHA256SUMS-gui

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: causewaybay-bank-macos-${{ steps.version.outputs.arch }}
          path: dist-gui/

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12"


  release:
    name: Create GitHub release
    needs: [package, package-gui]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            Two implementations of one specification — pick either binary, they
            share `~/.causewaybaywallet` and speak the same CLI.

            | archive | what is inside |
            | --- | --- |
            | `cwbwallet-rust-…apple-darwin.tar.gz` | the Rust build of `cwbwallet` |
            | `cwbwallet-python-…apple-darwin.tar.gz` | the Python build, CPython embedded |
            | `cwbwallet-lua-…apple-darwin.tar.gz` | the Lua front end plus `libcausewaybay_ffi.dylib` (needs LuaJIT) |
            | `cwbwallet-c-…apple-darwin.tar.gz` | the C build, the wallet statically linked in |
            | `CausewaybayBank-…apple-darwin.zip` | CAUSEWAYBAY BANK, the wallet as an 8-bit game — a double-clickable `.app` with LÖVE inside, signed and notarised |

            Verify a download against `SHA256SUMS`, then:

            ```sh
            tar -xzf cwbwallet-rust-*-apple-darwin.tar.gz
            ./cwbwallet --version
            ```

            ⚠️ Educational software. Keys are stored unencrypted on disk.
