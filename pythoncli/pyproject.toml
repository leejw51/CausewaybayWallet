[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causewaybay-wallet"
version = "1.0.2"
description = "Educational multi-chain wallet: a Python binding over the Rust core's C ABI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Causewaybay Wallet" }]
keywords = ["ethereum", "cronos", "solana", "cardano", "midnight", "wallet", "cli", "ffi"]

# None. The wallet is the Rust core, loaded through ctypes from the standard
# library: the cryptography, the store and the RPC all live there. A second set
# of Python crypto dependencies would be a second implementation to keep in
# step, which is exactly what this package stopped being.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.6.0", "anyio>=4.0.0"]

[project.scripts]
cwbwallet = "causewaybay.cli:main"

[tool.setuptools.packages.find]
include = ["causewaybay*"]

# The wallet itself, when one has been staged by `make release-lib`. A packaged
# binary has no checkout to search, so the shared library travels inside the
# wheel and `ffi.py` looks beside itself first. A plain `pip install` finds no
# library here and falls back to the search path, which is what a developer
# with a checkout wants.
[tool.setuptools.package-data]
causewaybay = ["*.dylib", "*.so", "*.dll"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
