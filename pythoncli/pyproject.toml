[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causewaybay-wallet"
version = "0.1.0"
description = "Educational Cronos/EVM wallet with a CLI and a TUI, backed by an append-only JSONL store"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Causewaybay Wallet" }]
keywords = ["ethereum", "cronos", "evm", "wallet", "cli", "tui"]

dependencies = [
    "eth-account>=0.13.0",
    "eth-utils>=5.0.0",
    "eth-hash[pycryptodome]>=0.7.0",
    "mnemonic>=0.21",
    "requests>=2.32.0",
    "textual>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.6.0", "anyio>=4.0.0"]

[project.scripts]
cwbwallet = "causewaybay.cli:main"

[tool.setuptools.packages.find]
include = ["causewaybay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
